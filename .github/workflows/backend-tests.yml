name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ChatApp.slnx

      - name: Build
        run: dotnet build ChatApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/ChatApp.Api.Tests --no-build --configuration Release --verbosity normal
